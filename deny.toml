# cargo-deny policy. Licences not listed here fail CI; adding one requires a
# DECISIONS.md entry explaining why it is compatible with Apache-2.0 distribution.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained (not vulnerable) non-cryptographic hash used by display-info
    # on Windows for display enumeration only. Revisit at the Cross-platform
    # milestone; replace display-info if upstream does not drop it. (D-008)
    { id = "RUSTSEC-2025-0057", reason = "unmaintained notice only; Windows display enumeration via display-info" },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # ffmpeg-next / ffmpeg-sys-next bindings (permissive; D-013)
    "WTFPL",
    # egui default fonts (epaint_default_fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
