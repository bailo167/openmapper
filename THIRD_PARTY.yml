# Third-party material that is not a Cargo dependency.
# Cargo dependencies are governed by deny.toml (licence allow-list).
#
# Each entry:
#   - path: repository path or glob
#     name: upstream name
#     licence: SPDX identifier
#     source: URL
#     notes: optional
entries:
  - path: LICENSE
    name: Apache License, Version 2.0 (canonical text)
    licence: Apache-2.0
    source: https://www.apache.org/licenses/LICENSE-2.0.txt
  - path: crates/om-isf/tests/corpus/*.fs
    name: OpenMapper ISF conformance corpus (original, first-party)
    licence: Apache-2.0
    source: written for OpenMapper; no third-party shader code
  - path: crates/om-syphon/vendor/syphon/*
    name: Syphon Framework (source; built as a static library on macOS)
    licence: BSD-3-Clause AND BSD-2-Clause
    source: https://github.com/Syphon/Syphon-Framework (commit f4761677a45b8034a3c2069ec0f3d2553da81fba)
    notes: >-
      Unmodified except SyphonServerRendererMetal.m, which compiles its
      Metal shaders from embedded source when no framework bundle exists
      (marked "OpenMapper patch"). Licence text in License.txt alongside.
