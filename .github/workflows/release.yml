# Release candidate: package on all three OSes, merge and sign the
# checksums, and (for a tag) open a *draft* GitHub release for the owner to
# review and publish. Nothing is published automatically.
#
# Signing posture (D-032, docs/release/signing.md): SHA256SUMS is signed
# keylessly with Sigstore (cosign) using this workflow's GitHub Actions
# OIDC identity — no key to keep, and the signature proves which repository,
# workflow and tag produced the files. Verification:
#
#   cosign verify-blob --bundle SHA256SUMS.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/bailo167/openmapper/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     SHA256SUMS
#   sha256sum -c SHA256SUMS
#
# Binary code signing (Apple Developer ID + notarisation, Windows
# Authenticode) runs inside package.yml when the publisher's secrets exist.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    secrets: inherit

  publish:
    name: sign checksums and draft the release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # draft release on a tag
      id-token: write # Sigstore keyless signing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: openmapper-*
          path: dist
          merge-multiple: true
      - name: merge and verify the checksums
        working-directory: dist
        run: |
          cat SHA256SUMS.* | sort -u -k2 > SHA256SUMS
          rm SHA256SUMS.*
          sha256sum -c SHA256SUMS
          ls -l
      - uses: sigstore/cosign-installer@v3
      - name: sign SHA256SUMS (Sigstore keyless, GitHub OIDC)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: verify the signature as a user would
        working-directory: dist
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          retention-days: 30
      - name: draft the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "**Draft — not yet reviewed by the owner.** Known gaps: RELEASE_GAPS.md at this tag."
            echo
            echo "## Verify your download"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS   # or: shasum -a 256 -c SHA256SUMS"
            echo "cosign verify-blob --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/$TAG \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS"
            echo '```'
            echo
            echo "The binaries are not code-signed (docs/release/signing.md explains the"
            echo "Gatekeeper and SmartScreen steps). Each archive bundles LGPL FFmpeg"
            echo "shared libraries; their complete source is attached as"
            echo "\`ffmpeg-*-src.tar.gz\` and the build recipe is in \`ffmpeg/\` inside"
            echo "the archive. PROVENANCE.txt is the clean-room scan of this tag's history."
          } > notes.md
          gh release create "$TAG" --draft --verify-tag --title "OpenMapper $TAG" --notes-file notes.md dist/*
