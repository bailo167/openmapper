[workspace]
resolver = "3"
members = [
    "crates/om-types",
    "crates/om-time",
    "crates/om-geom",
    "crates/om-project",
    "crates/om-command",
    "crates/om-media-core",
    "crates/om-gpu",
    "crates/om-render",
    "crates/om-output",
    "crates/om-media-ffmpeg",
    "crates/om-audio",
    "crates/om-isf",
    "crates/om-show",
    "crates/om-osc",
    "crates/om-oscquery",
    "crates/om-midi",
    "crates/om-dmx",
    "crates/om-calibration",
    "crates/om-plugin-api",
    "crates/om-plugin-host",
    "crates/om-engine",
    "crates/om-spout",
    "crates/om-ndi",
    "crates/om-syphon",
    "crates/om-platform",
    "crates/om-ui-egui",
    "apps/openmapper",
    "apps/openmapper-cli",
    "tools/xtask",
    "tools/fixturegen",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/bailo167/openmapper"
publish = false

[workspace.dependencies]
om-types = { path = "crates/om-types" }
om-time = { path = "crates/om-time" }
om-geom = { path = "crates/om-geom" }
om-project = { path = "crates/om-project" }
om-command = { path = "crates/om-command" }
om-media-core = { path = "crates/om-media-core" }
om-gpu = { path = "crates/om-gpu" }
om-render = { path = "crates/om-render" }
om-output = { path = "crates/om-output" }
om-media-ffmpeg = { path = "crates/om-media-ffmpeg" }
om-platform = { path = "crates/om-platform" }
om-spout = { path = "crates/om-spout" }
om-ndi = { path = "crates/om-ndi" }
om-syphon = { path = "crates/om-syphon" }
om-audio = { path = "crates/om-audio" }
om-isf = { path = "crates/om-isf" }
om-show = { path = "crates/om-show" }
om-osc = { path = "crates/om-osc" }
om-oscquery = { path = "crates/om-oscquery" }
om-midi = { path = "crates/om-midi" }
om-dmx = { path = "crates/om-dmx" }
om-calibration = { path = "crates/om-calibration" }
om-plugin-api = { path = "crates/om-plugin-api" }
om-plugin-host = { path = "crates/om-plugin-host" }
om-engine = { path = "crates/om-engine" }
om-ui-egui = { path = "crates/om-ui-egui" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"
ulid = "3.0.0"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
tempfile = "3.27.0"
proptest = "1.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
glam = { version = "0.34.1", features = ["serde"] }
# GUI/GPU stack: pinned exactly, upgraded only in dedicated PRs (docs/PLAN.md).
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
# Must equal the version egui-wgpu uses so the UI and renderer share a device (D-006).
wgpu = { version = "=30.0.1", features = ["naga-ir"] }
# Same version as wgpu's; used to parse and validate translated ISF GLSL.
# `wgsl-in` works around naga 30.0.1 compiling glsl-in without the
# interpolator module it needs (upstream cfg bug).
naga = { version = "=30.0.1", features = ["glsl-in", "wgsl-in"] }
regex = "1.13.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
half = "2.7.1"
display-info = "0.5.9"
# Dynamically linked via pkg-config (or FFMPEG_DIR); see docs/media/ffmpeg.md.
# No `filter`: libavfilter is not used, so release bundles need not ship it.
ffmpeg-next = { version = "9.0.0", default-features = false, features = [
    "codec",
    "device",
    "format",
    "software-resampling",
    "software-scaling",
] }
# macOS capture-device enumeration (names match FFmpeg's avfoundation input).
objc2-av-foundation = "0.3.2"
cpal = "0.18.2"
# Spout (Windows): shared memory, named mutexes and D3D11 shared textures.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
# NDI: the user's installed runtime is loaded at run time, never bundled.
libloading = "0.8.9"
# Builds the vendored Syphon sources (macOS).
cc = "1.6.0"
# WebAssembly plugins (milestone 9): JIT, WAT text for fixtures, no WASI.
wasmtime = { version = "49.0.2", default-features = false, features = ["std", "runtime", "cranelift", "wat", "anyhow"] }
rosc = "0.11.4"
mdns-sd = "0.21.5"
midir = "0.11.0"
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

# Keep build directories small: full debug info only for our own code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = "line-tables-only"

# Distributed binaries (`cargo xtask dist`): release, without debug info.
[profile.distribution]
inherits = "release"
debug = false
strip = true
